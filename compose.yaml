services:
  postgres:
    image: docker.io/library/postgres:18.4
    environment:
      POSTGRES_USER: nulysa
      POSTGRES_PASSWORD: synthetic-local-password
      POSTGRES_DB: nulysa
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nulysa -d nulysa"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres:
